# nvlens is a virtual workspace; see crates/ for the member crates.
[workspace]
resolver = "3"
members = [
    "crates/nvlens-io",
    "crates/nvlens-core",
    "crates/nvlens-crypto",
    "crates/nvlens-bin",
    "crates/nvlens-unpack",
    "crates/nvlens-engine",
    "crates/nvlens-archive",
    "crates/nvlens-image",
    "crates/nvlens-audio",
    "crates/nvlens-script",
    "crates/nvlens-video",
    "crates/nvlens-gui",
]
default-members = ["crates/nvlens-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

# Unified dependency versions; crates reference them with `dep.workspace = true`.
[workspace.dependencies]
nvlens-io = { path = "crates/nvlens-io" }
nvlens-core = { path = "crates/nvlens-core" }
nvlens-crypto = { path = "crates/nvlens-crypto" }
nvlens-bin = { path = "crates/nvlens-bin" }
nvlens-unpack = { path = "crates/nvlens-unpack" }
nvlens-engine = { path = "crates/nvlens-engine" }
nvlens-archive = { path = "crates/nvlens-archive" }
nvlens-image = { path = "crates/nvlens-image" }
nvlens-audio = { path = "crates/nvlens-audio" }
nvlens-script = { path = "crates/nvlens-script" }
nvlens-video = { path = "crates/nvlens-video" }


memmap2 = "0.9"
thiserror = "2"
anyhow = "1"
inventory = "0.3"
flate2 = "1"
argon2 = "0.5.3"
blake2 = "0.10.6"
sha3 = "0.10"
chacha20poly1305 = "0.10"
aes = "0.8.4"
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info"] }
gpui = "=0.2.2"
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
unicode-segmentation = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }
lewton = "0.10.2"
ogg = "0.8"
opus1 = "0.3.0"
rustfft = { version = "6.4.1", default-features = false }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
