# nvlens is a virtual workspace; see crates/ for the member crates.
[workspace]
resolver = "3"
members = [
    "crates/nvlens-io",
    "crates/nvlens-core",
    "crates/nvlens-crypto",
    "crates/nvlens-archive",
    "crates/nvlens-image",
    "crates/nvlens-audio",
    "crates/nvlens-script",
    "crates/nvlens-video",
    "crates/nvlens-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

# Unified dependency versions; crates reference them with `dep.workspace = true`.
[workspace.dependencies]
nvlens-io = { path = "crates/nvlens-io" }
nvlens-core = { path = "crates/nvlens-core" }
nvlens-crypto = { path = "crates/nvlens-crypto" }
nvlens-archive = { path = "crates/nvlens-archive" }
nvlens-image = { path = "crates/nvlens-image" }
nvlens-audio = { path = "crates/nvlens-audio" }
nvlens-script = { path = "crates/nvlens-script" }
nvlens-video = { path = "crates/nvlens-video" }

memmap2 = "0.9"
thiserror = "2"
anyhow = "1"
inventory = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
