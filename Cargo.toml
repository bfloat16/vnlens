# vnlens is a virtual workspace; see crates/ for the member crates.
[workspace]
resolver = "3"
members = [
    "crates/vnlens-io",
    "crates/vnlens-core",
    "crates/vnlens-crypto",
    "crates/vnlens-bin",
    "crates/vnlens-unpack",
    "crates/vnlens-engine",
    "crates/vnlens-archive",
    "crates/vnlens-image",
    "crates/vnlens-audio",
    "crates/vnlens-script",
    "crates/vnlens-video",
    "crates/vnlens-gui",
    "crates/vnlens-xtask",
]
default-members = ["crates/vnlens-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

# Unified dependency versions; crates reference them with `dep.workspace = true`.
[workspace.dependencies]
vnlens-io = { path = "crates/vnlens-io" }
vnlens-core = { path = "crates/vnlens-core" }
vnlens-crypto = { path = "crates/vnlens-crypto" }
vnlens-bin = { path = "crates/vnlens-bin" }
vnlens-unpack = { path = "crates/vnlens-unpack" }
vnlens-engine = { path = "crates/vnlens-engine" }
vnlens-archive = { path = "crates/vnlens-archive" }
vnlens-image = { path = "crates/vnlens-image" }
vnlens-audio = { path = "crates/vnlens-audio" }
vnlens-script = { path = "crates/vnlens-script" }
vnlens-video = { path = "crates/vnlens-video" }


memmap2 = "0.9"
thiserror = "2"
anyhow = "1"
inventory = "0.3"
flate2 = "1"
ruzstd = "0.9.1"
argon2 = "0.5.3"
blake2 = "0.10.6"
sha3 = "0.10"
chacha20poly1305 = "0.10"
aes = "0.8.4"
cubecl = { package = "cubecl-core", version = "=0.10.0", default-features = false, features = ["std"] }
cubecl-wgpu = { version = "=0.10.0", default-features = false, features = ["std"] }
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info"] }
gpui = "=0.2.2"
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
unicode-segmentation = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texture2ddecoder = "0.1.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico", "tga"] }
lewton = "0.10.2"
ogg = "0.8"
opus1 = "0.3.0"
rustfft = { version = "6.4.1", default-features = false }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# Links the FFmpeg 9 shared libraries; `cargo ffmpeg` fetches a pinned build.
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format", "codec", "software-scaling", "software-resampling"] }
sha2 = "0.11.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
